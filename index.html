<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram GCash Rewards</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag -->
  <script src="//libtl.com/sdk.js"
    data-zone="10276123"
    data-sdk="show_10276123"></script>

  <!-- App Logic -->
  <script type="module" src="app.js"></script>

  <style>
    body{font-family:Arial;background:#020617;color:#e5e7eb;padding:15px}
    button,input{width:100%;padding:10px;margin-top:8px}
    table{width:100%;font-size:13px;margin-top:8px}
    .row{display:flex;gap:8px;margin-top:8px}
  </style>
</head>
<body>

<h2>👤 <span id="username"></span></h2>
<h3>💰 Balance: ₱<span id="balance">0.000</span></h3>

<button onclick="watchAd()">Watch Ad (+₱0.015)</button>

<h3>🏧 Withdraw (GCash)</h3>
<input id="gcash" placeholder="GCash Number">
<input id="amount" type="number" placeholder="Min ₱0.015">
<button onclick="requestWithdraw()">Request Withdrawal</button>

<h3>📜 Withdrawal History</h3>
<table border="1">
  <thead>
    <tr><th>Date</th><th>GCash</th><th>Amount</th><th>Status</th></tr>
  </thead>
  <tbody id="history"></tbody>
</table>

<div class="row">
  <button onclick="prevUserPage()">⬅ Prev</button>
  <button onclick="nextUserPage()">Next ➡</button>
</div>

<hr>

<button onclick="ownerLogin()">Owner Dashboard</button>

<div id="owner" style="display:none">
  <h3>📊 Owner Dashboard</h3>
  <p>Total Users: <span id="totalUsers">0</span></p>
  <p>Total Withdrawn: ₱<span id="totalWithdraw">0</span></p>
  <p>Total Pending: ₱<span id="totalPending">0</span></p>

  <table border="1">
    <thead>
      <tr><th>User</th><th>GCash</th><th>Amount</th><th>Status</th><th>Action</th></tr>
    </thead>
    <tbody id="adminTable"></tbody>
  </table>

  <div class="row">
    <button onclick="prevAdminPage()">⬅ Prev</button>
    <button onclick="nextAdminPage()">Next ➡</button>
  </div>
</div>

</body>
</html>
