
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎖🤑PAPERHOUSE INC ADS🤑🎖</title>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        :root { --gold: #FFD700; --glass: rgba(0, 0, 0, 0.8); }
        body {
            margin: 0; padding: 0;
            font-family: 'Roboto', sans-serif;
            color: white;
            transition: background 0.3s ease;
            background-attachment: fixed;
            background-size: cover;
        }

        .overlay { background: rgba(0,0,0,0.6); min-height: 100vh; padding-bottom: 80px; }

        .container { max-width: 500px; margin: auto; }

        header {
            background: linear-gradient(to bottom, #004488, transparent);
            padding: 25px 15px; text-align: center;
            font-family: 'Black Ops One', cursive;
            color: var(--gold); text-shadow: 2px 2px black;
        }

        .card {
            background: var(--glass); margin: 15px; padding: 20px;
            border-radius: 15px; border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .stat-item { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; text-align: center; }

        input {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px;
            border: none; background: #222; color: white; box-sizing: border-box;
        }

        .btn {
            width: 100%; padding: 15px; border: none; border-radius: 8px;
            font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px;
        }
        .btn-reward { background: var(--gold); color: #000; font-size: 1.2rem; }
        .btn-blue { background: #0070E0; color: white; }

        /* Referral Section */
        #ref-area { border: 2px dashed var(--gold); }

        /* Online Users */
        .online-tag { color: #00ff00; font-size: 0.8rem; }

        /* Chat */
        #chat-box { height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }

        .msg { background: rgba(255,255,255,0.15); padding: 8px; border-radius: 8px; font-size: 0.9rem; }

        /* Navigation */
        nav {
            position: fixed; bottom: 0; width: 100%; max-width: 500px;
            background: #000; display: flex; justify-content: space-around; padding: 10px 0;
        }
        .nav-item { color: #aaa; font-size: 0.7rem; text-align: center; cursor: pointer; }
        .nav-item.active { color: var(--gold); }

        /* Reward Pop-up Styles */
        #reward-popup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 9999; display: none; text-align: center;
        }
        .reward-circle {
            width: 150px; height: 150px; background: var(--gold); color: black;
            border-radius: 50%; display: flex; flex-direction: column;
            justify-content: center; align-items: center; font-weight: bold;
            box-shadow: 0 0 50px var(--gold); border: 5px solid white;
        }

        .page { display: none; }
        .page.active { display: block; }
    </style>

    <!-- Monetag SDK -->
    <script src='//libtl.com/sdk.js' data-zone='10337853' data-sdk='show_10337853'></script>
</head>
<body onclick="changeBg()">

<div class="overlay">
    <div class="container">
        
        <!-- Auth -->
        <div id="page-login" class="page active">
            <header><h1>PAPERHOUSE INC</h1></header>
            <div class="card">
                <h3>Login / Register</h3>
                <input type="text" id="login-user" placeholder="Username">
                <input type="number" id="login-gcash" placeholder="GCash Number">
                <input type="text" id="login-ref" placeholder="Referrer Username (Optional)">
                <button class="btn btn-reward" onclick="processLogin()">Enter Immediately</button>
            </div>
        </div>

        <!-- Home -->
        <div id="page-main" class="page">
            <header><h1>🎖 DASHBOARD 🎖</h1></header>
            <div class="card" style="text-align:center;">
                <span id="online-status" class="online-tag">● Online</span>
                <div style="font-size: 2.5rem; color: var(--gold); font-weight: bold;">₱<span id="bal">0.00</span></div>
                <div class="stat-grid">
                    <div class="stat-item">Daily Ads<br><b id="day-ads">0</b></div>
                    <div class="stat-item">Daily Earn<br><b>₱<span id="day-earn">0.00</span></b></div>
                </div>
                <button class="btn btn-reward animate__animated animate__pulse animate__infinite" onclick="watchAd()">WATCH AD (₱0.01)</button>
            </div>

            <div class="card" id="ref-area">
                <h4>Referral System (8%)</h4>
                <div class="stat-grid">
                    <div class="stat-item">Invites<br><b id="ref-count">0</b></div>
                    <div class="stat-item">Claimable<br><b>₱<span id="ref-bonus">0.00</span></b></div>
                </div>
                <button class="btn btn-blue" onclick="claimReferral()">Claim Bonus</button>
            </div>
        </div>

        <!-- Chat -->
        <div id="page-chat" class="page">
            <header><h1>GLOBAL CHAT</h1></header>
            <div class="card">
                <div id="chat-box"></div>
                <div id="chat-cooldown" style="color:red; font-size:0.8rem; display:none;">Ad Cooldown: <span id="cd-timer">0</span>s</div>
                <input type="text" id="chat-msg" placeholder="Type a message...">
                <button class="btn btn-reward" onclick="sendChat()">Send (Earn ₱0.012)</button>
            </div

>
            <div class="card">
                <h4>Online Users</h4>
                <div id="online-list" style="font-size:0.8rem; line-height:1.6;"></div>
            </div>
        </div>

        <!-- Help -->
        <div id="page-help" class="page">
            <header><h1>HELP CENTER</h1></header>
            <div class="card">
                <button class="btn btn-blue" onclick="window.open('https://t.me/paperhouseinc')">Telegram Group</button>
                <button class="btn btn-blue" onclick="window.open('https://t.me/PAPERHOUSE_INC')">Telegram Channel</button>
                <button class="btn btn-blue" onclick="window.open('https://facebook.com/groups/1193693469083843/')">Facebook Group</button>
                <button class="btn btn-blue" onclick="window.open('https://www.facebook.com/profile.php?id=61586281245735')">Facebook Page</button>
            </div>
        </div>

        <!-- Withdraw -->
        <div id="page-withdraw" class="page">
            <header><h1>CASHOUT</h1></header>
            <div class="card">
                <p>GCash: <b id="user-gcash"></b></p>
                <input type="number" id="withdraw-amt" placeholder="Min 0.02">
                <button class="btn btn-reward" onclick="withdraw()">Withdraw to GCash</button>
            </div>
        </div>

    </div>

    <!-- Navigation -->
    <nav id="navbar" style="display:none;">
        <div class="nav-item" onclick="showPage('page-main')">🏠<br>Home</div>
        <div class="nav-item" onclick="showPage('page-chat')">💬<br>Chat</div>
        <div class="nav-item" onclick="showPage('page-help')">❓<br>Help</div>
        <div class="nav-item" onclick="showPage('page-withdraw')">💰<br>Cashout</div>
    </nav>
</div>

<!-- Reward Pop-up -->
<div id="reward-popup">
    <div class="reward-circle" id="reward-anim-target">
        <span style="font-size:0.8rem">RECEIVED</span>
        <div id="pop-amt">₱0.01</div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
