<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPERHOUSE INC</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Placeholder for Monetag Scripts - Ensure your actual Monetag tags are here -->
    <style>
        :root {
            --sky-blue: #87CEEB;
            --yellow-green: #9ACD32;
            --classical-yellow: #FFD700;
        }

        body {
            margin: 0; padding: 0; font-family: 'Arial', sans-serif;
            background-color: var(--sky-blue);
            transition: background 0.5s; min-height: 100vh;
            display: flex; flex-direction: column; overflow-x: hidden;
        }

        /* Rainbow Animation */
        body.rainbow-mode {
            animation: rainbowBG 5s linear infinite;
        }
        @keyframes rainbowBG {
            0% { background: #ffadad; } 20% { background: #ffd6a5; }
            40% { background: #fdffb6; } 60% { background: #caffbf; }
            80% { background: #9bf6ff; } 100% { background: #ffadad; }
        }

        header { background: rgba(255,255,255,0.2); padding: 15px; text-align: center; border-bottom: 2px solid rgba(0,0,0,0.1); }
        #userBar { font-weight: bold; font-size: 1.1em; }
        #balanceDisplay { font-size: 1.8em; color: #1b5e20; font-weight: 900; margin-top: 5px; }

        .container { flex: 1; padding: 20px; text-align: center; }
        
        .btn {
            background-color: var(--yellow-green);
            color: black; border: none; padding: 15px 20px;
            font-size: 16px; font-weight: bold; border-radius: 12px;
            cursor: pointer; margin: 10px; transition: 0.2s;
            box-shadow: 0 4px #6b8e23; width: 80%; max-width: 300px;
        }
        .btn:active {
            background-color: var(--classical-yellow) !important;
            transform: translateY(3px);
            box-shadow: 0 1px #6b8e23;
        }

        .card { background: white; padding: 15px; margin: 10px auto; border-radius: 15px; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        input { padding: 10px; width: 80%; margin: 5px 0; border-radius: 8px; border: 1px solid #ccc; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; border-radius: 10px; overflow: hidden; font-size: 12px; }        th, td { padding: 10px; border: 1px solid #eee; text-align: center; }
        th { background: #333; color: white; }

        .hidden { display: none; }
        footer { background: #333; color: white; padding: 15px; text-align: center; font-size: 11px; margin-top: auto; }
        
        .claim-btn { background: #ff9800 !important; box-shadow: 0 4px #e68a00 !important; }
    </style>
</head>
<body id="appBody" onclick="enableRainbow()">

    <header>
        <div id="userBar">👤 Loading User...</div>

        <div id="ads-list">
            <!-- Standard Tasks -->
            <div class="card">
                <button class="btn" id="task1" onclick="handleAdTask(1)">🤑🍍Task #1🍍🤑</button>

            </div>
            <div class="card">
                <button class="btn" id="task2" onclick="handleAdTask(2)">🤑🍍Task #2🍍🤑</button>

            <div class="card">
                <button class="btn" id="task3" onclick="handleAdTask(3)">🤑🍍Task #3🍍🤑</button>
                <button class="btn claim-btn hidden" id="claim3" onclick="claimReward(3)">Claim ₱0.02</button>
            </div>
            <div class="card">
                <button class="btn" id="task4" onclick="handleAdTask(4)">🤑🍍Task #4🍍🤑</button>                <button class="btn claim-btn hidden" id="claim4" onclick="claimReward(4)">Claim ₱0.02</button>
            </div>
            <hr>
            <h3>BONUS TASKS</h3>
            <div class="card">
                <button class="btn" id="taskB1" onclick="handleAdTask('B1')">💎 BONUS TASK #1 💎</button>
                <button class="btn claim-btn hidden" id="claimB1" onclick="claimReward('B1')">Claim ₱0.02</button>
            </div>
            <div class="card">
                <button class="btn" id="taskB2" onclick="handleAdTask('B2')">💎 BONUS TASK #2 💎</button>
                <button class="btn claim-btn hidden" id="claimB2" onclick="claimReward('B2')">Claim ₱0.02</button>
            </div>
            <div class="card">
                <button class="btn" id="taskB3" onclick="handleAdTask('B3')">💎 BONUS TASK #3 💎</button>
                <button class="btn claim-btn hidden" id="claimB3" onclick="claimReward('B3')">Claim ₱0.02</button>
            </div>
        </div>
    </div>

    <!-- Withdrawal Page -->
    <div id="page-withdraw" class="container hidden">
        <button class="btn" onclick="nav('page-home')" style="width:100px; padding:5px;">⬅ Back</button>
        <div class="card">
            <h3>GCASH WITHDRAWAL</h3>
            <input type="text" id="gcName" placeholder="GCash Full Name">
            <input type="text" id="gcNum" placeholder="GCash Number">
            <input type="number" id="gcAmt" placeholder="Amount (min 0.50)"><button class="btn" onclick="submitWithdraw()">SUBMIT REQUEST</button>
        </div>
        <h3>Live Status</h3>
        <table id="userWithdrawTable">
            <thead><tr><th>Date</th><th>Amount</th><th>Status</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Admin Dashboard -->
    <div id="page-admin" class="container hidden">
        <button class="btn" onclick="nav('page-home')" style="width:100px; padding:5px;">⬅ Exit</button>
        <h2>OWNER DASHBOARD</h2>
        <table id="adminWithdrawTable">
            <thead><tr><th>User</th><th>GCash Info</th><th>Amount</th><th>Action</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <footer>
        <div id="footerTime">PAPERHOUSE INC | --/--/-- --:--:--</div>
        otico.isai2@gmail.com
    </footer>

    <!-- Firebase App (Modular) -->
    <script type="module" src="app.js"></script>
    <script>
        function enableRainbow() { document.body.classList.add('rainbow-mode'); }
    </script>
</body>
</html>
