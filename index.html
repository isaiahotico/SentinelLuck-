<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPERHOUSE INC</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Include Monetag Scripts here -->
    <style>
        :root {
            --sky-blue: #87CEEB;
            --yellow-green: #9ACD32;
            --classical-yellow: #FFD700;
        }

        body {
            margin: 0; font-family: sans-serif;
            background-color: var(--sky-blue);
            transition: background 0.5s; min-height: 100vh;
            display: flex; flex-direction: column;
        }

        .rainbow {
            animation: rainbowBG 3s linear infinite;
        }
        @keyframes rainbowBG {
            0% { background: #ffadad; } 20% { background: #ffd6a5; }
            40% { background: #fdffb6; } 60% { background: #caffbf; }
            80% { background: #9bf6ff; } 100% { background: #ffadad; }
        }

        header { background: rgba(255,255,255,0.3); padding: 15px; text-align: center; border-bottom: 2px solid #555; }
        .balance-box { font-size: 24px; font-weight: bold; color: #2d5a27; }
        
        .container { padding: 20px; flex: 1; text-align: center; }
        
        .btn {
            background-color: var(--yellow-green);
            border: none; padding: 15px 20px; font-size: 16px;
            font-weight: bold; border-radius: 10px; cursor: pointer;
            margin: 10px; transition: 0.2s; box-shadow: 0 4px #6b8e23;
        }
        .btn:active { background-color: var(--classical-yellow) !important; transform: translateY(2px); box-shadow: 0 2px #6b8e23; }
        
        .task-card { background: white; padding: 15px; margin: 10px auto; border-radius: 15px; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .cooldown { color: red; font-size: 12px; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }

        .hidden { display: none; }
        footer { background: #222; color: white; padding: 20px; text-align: center; font-size: 12px; }

        #adminSection { background: #f0f0f0; border: 5px dashed red; padding: 10px; }
    </style>
</head>
<body id="mainBody" onclick="this.classList.add('rainbow')">

    <header>

        <div id="userBar">👤 User: Loading...</div>
        <div class="balance-box">₱<span id="userBalance">0.00</span></div>
    </header>

    <div id="homePage" class="container">
        <h1>PAPERHOUSE INC</h1>
        <button class="btn" onclick="showPage('adsArea')">🍍PAPERHOUSE ADS AREA🍍</button>
        <button class="btn" onclick="showPage('withdrawPage')">💸 WITHDRAW GCASH</button>
        <button class="btn" style="opacity: 0.3;" onclick="checkAdmin()">⚙️ OWNER</button>
    </div>

    <!-- Ads Area -->
    <div id="adsArea" class="container hidden">
        <button onclick="showPage('homePage')">⬅ Back</button>
        <h2>Tasks</h2>
        <div id="taskList"></div>
    </div>

    <!-- Withdrawal Page -->
    <div id="withdrawPage" class="container hidden">
        <button onclick="showPage('homePage')">⬅ Back</button>
        <h2>Withdraw to GCASH</h2>
        <input type="text" id="gcashName" placeholder="GCash Name"><br><br>
        <input type="text" id="gcashNum" placeholder="GCash Number"><br><br>
        <input type="number" id="withdrawAmount" placeholder="Amount (min 0.50)"><br><br>
        <button class="btn" onclick="requestWithdrawal()">Submit Request</button>
        
        <h3>My Withdrawals</h3>
        <table id="userWithdrawTable">
            <thead><tr><th>Amount</th><th>Status</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminPage" class="container hidden">
        <button onclick="showPage('homePage')">⬅ Close Admin</button>
        <div id="adminSection">
            <h2>OWNER DASHBOARD</h2>
            <table id="adminTable">
                <thead><tr><th>User</th><th>GCash</th><th>Amount</th><th>Action</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <footer>
        <div id="footerText"></div>
        PAPERHOUSE INC | otico.isai2@gmail.com
    </footer>

    <!-- Firebase SDKs -->
    <script type="module" src="app.js"></script>
</body>
</html>
